[package]
name = "catshare"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"

# Font loading
font-kit = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking
local-ip-address = "0.6"

# Compression (high performance)
lz4_flex = "0.11"
zstd = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"

# Random generation
rand = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internationalization
rust-i18n = "3"
sys-locale = "0.3"

# File dialog
rfd = "0.15"

# Threading
rayon = "1"
crossbeam-channel = "0.5"

# Progress tracking
indicatif = "0.17"

# Hashing for integrity
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Directory paths
dirs = "5"

# Image processing
image = "0.25"

# Post-Quantum Cryptography (ML-KEM-768, ML-DSA-65)
pqcrypto-mlkem = "0.1"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

# Symmetric Encryption (AES-256-GCM)
aes-gcm = "0.10"

# SHA-3 Hashing
sha3 = "0.10"

# Secure random number generation
getrandom = "0.2"

# Base64 encoding for key exchange
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
